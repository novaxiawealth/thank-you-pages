<!--BlooHealth thank you page.
Simple thank you and redirection to Novaxia site by button.-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You Page | BlooHealth</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="stylesheet" href="css/base.css">

  <style>
    :root {
      --bg-main: #0ba9a6;
      --primary: #0ba9a6;
      --primary-hover: #088c8a;
      --accent: #0ba9a6;
      --title-color: #075f5d;
    }

    body {
      background: var(--bg-main);
      animation: none;
    }

    .btn {
      color: #ffffff;
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <div class="card">

      <div class="logo">
        <img src="assets/images/bloohealth.jpg" alt="BlooHealth logo">
      </div>

      <div class="divider"></div>

      <div class="title">Thank you!</div>
      <div class="subtitle">We appreciate your trust.</div>

      <a href="#" class="btn">Visit the Novaxia Website</a>

    </div>
  </div>

</body>
</html>
